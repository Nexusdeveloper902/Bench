[package]
name = "simcore"
version = "0.1.0"
edition = "2021"
description = "Production simulation core: native kernel + electrical domain over libngspice"

[lib]
name = "simcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "0.9"
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1.13.1"
