[pytest]
# Plain `pytest` means the app suite. benchcore/tests/python has its own test_live.py (same basename as
# app/tests/test_live.py), so the two dirs must never share a session; scripts/test runs them separately.
testpaths = app/tests
markers =
    timing: asserts wall-clock behaviour; run serially on a quiet CPU (scripts/test check does this)
