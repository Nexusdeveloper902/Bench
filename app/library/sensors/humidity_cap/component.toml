format = 1
id = "HUMIDITY_CAP"
version = 1
name = "Capacitive humidity sensor (linear C(RH))"
description = "Capacitive relative-humidity sensor: C = C0 + CS·RH over the middle of the range. The relative humidity is a parameter."
designator = "CH"
label = "RH"
category = "Sensors"
subcategory = "Humidity"
aliases = ["capacitive humidity sensor", "RH sensor"]
keywords = ["humidity", "relative humidity", "capacitance", "polymer", "sensor", "subcircuit"]
tags = ["sensor", "humidity"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Linear capacitance law C = C0 + CS·RH with generic C0 (180 pF) and CS (0.4 pF per %RH). It is a fair approximation only over about 20 to 80 %RH; the ends are not modelled.",
               "The humidity is a fixed parameter, not a stimulus node: ngspice has no voltage-controlled capacitor without ddt(), and ddt() of a stimulus step is a timestep artifact, so the value is folded into C at load.",
               "No hysteresis, no temperature dependence, no leakage and no ageing."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 30]
symbol = "symbol.svg"

[[pins]]
id = "a"
at = [0, 15]

[[pins]]
id = "b"
at = [60, 15]

[[params]]
key = "rh"
label = "Relative humidity (%RH)"
default = "50"
min = 0
max = 100

[[params]]
key = "c0"
label = "Capacitance at 0 %RH"
unit = "F"
default = "180p"
min = 0
min_exclusive = true

[[params]]
key = "cs"
label = "Capacitance slope (F per %RH)"
unit = "F"
default = "0.4p"
min = 0
min_exclusive = true

[sim.electrical]
device = "X"
line = "{dev} {a} {b} bench_rh C0={c0} CS={cs} RH={rh}"
body = """
.subckt bench_rh a b params: C0=180p CS=0.4p RH=50
C1 a b {C0+CS*RH}
.ends bench_rh
"""
model_kind = "equivalent"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; linear capacitance-humidity law C = C0 + CS·RH, generic values"
license = "MIT"
