format = 1
id = "STRAIN_GAUGE"
version = 1
name = "Strain gauge (R·(1 + GF·ε))"
description = "Metal-foil strain gauge: R = R0·(1 + GF·ε). The strain is a parameter, in microstrain (µε)."
designator = "RS"
label = "STRAIN"
category = "Sensors"
subcategory = "Force and position"
aliases = ["strain gage", "foil gauge"]
keywords = ["strain", "gauge factor", "resistance", "sensor", "subcircuit"]
tags = ["sensor", "passive"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Linear gauge equation R = R0·(1 + GF·ε) with a generic gauge factor (2.0); no nonlinearity, transverse sensitivity or temperature compensation.",
               "The strain is fixed during a batch run (a live run can change it). The gauge is an ideal resistor; no bonding, creep or fatigue."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 30]
symbol = "symbol.svg"

[[pins]]
id = "a"
at = [0, 15]

[[pins]]
id = "b"
at = [60, 15]

[[params]]
key = "r0"
label = "Unstrained resistance"
unit = "Ω"
default = "350"
min = 0
min_exclusive = true

[[params]]
key = "gf"
label = "Gauge factor GF"
default = "2"
min = 0
min_exclusive = true
help = "Generic metal-foil value"

[[params]]
key = "eps"
label = "Strain ε (µε)"
default = "0"
min = -10000
max = 10000
help = "Microstrain: 1 µε = 1e-6 m/m"

[sim.electrical]
device = "X"
line = "{dev} {a} {b} bench_sg R0={r0} GF={gf} EPS={eps}"
body = """
.subckt bench_sg a b params: R0=350 GF=2 EPS=0
VSTIM stim 0 DC {EPS}
RSTIM stim 0 1G
B1 a b I={V(a,b)/(R0*(1+GF*V(stim)*1e-6))}
.ends bench_sg
"""
model_kind = "equivalent"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; gauge equation R = R0(1 + GF·ε); GF and R0 generic"
license = "MIT"
