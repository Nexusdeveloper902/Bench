format = 1
id = "ESP32_DEVKITC"
version = 1
name = "ESP32-DevKitC V4"
description = "Espressif development board with an ESP32-WROOM-32 module and two 19-pin headers (J2, J3)."
designator = "U"
category = "Microcontrollers"
subcategory = "Development boards"
aliases = ["ESP32", "ESP-WROOM-32", "DevKitC"]
keywords = ["wifi", "bluetooth", "espressif", "mcu", "gpio"]
tags = ["3.3 V logic"]
domain = "mcu"
capabilities = ["interface"]
limitations = ["Not simulated: no MCU emulation; firmware does not run and GPIO pins are not driven.",
