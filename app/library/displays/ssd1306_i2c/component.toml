# Order VCC, GND, SCL, SDA as in the Shillehtek manual (the Open-Electronics page cited earlier is gone: HTTP 404, and
# it printed GND first, which is why other modules differ).
pins = [
  {id = "VCC", at = [0, 20], description = "Power, 3.3-5 V"},
  {id = "GND", at = [0, 40], description = "Ground"},
  {id = "SCL", at = [0, 60], description = "I2C clock"},
  {id = "SDA", at = [0, 80], description = "I2C data"},
]

