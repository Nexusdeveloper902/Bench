format = 1
id = "CAP_FILM"
version = 1
name = "Film capacitor (ESR/ESL)"
description = "Polymer film capacitor: low ESR, very high insulation resistance, non-polarised. Generic values."
designator = "C"
category = "Electrical"
subcategory = "Passives"
aliases = ["polyester capacitor", "polypropylene capacitor", "metallised film"]
keywords = ["capacitor", "film", "polypropylene", "ESR", "ESL", "subcircuit"]
tags = ["passive"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Generic: dielectric absorption (the slow voltage recovery of a film) is not modelled.",
               "No voltage or temperature coefficient; ESR and ESL are fixed generic values."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
value = "C"
box = [0, 0, 80, 40]
symbol = "symbol.svg"

[[pins]]
id = "a"
at = [0, 20]

[[pins]]
id = "b"
at = [80, 20]

[[params]]
key = "C"
label = "Capacitance"
unit = "F"
default = "1u"
min = 0
min_exclusive = true

[[params]]
key = "esr"
label = "ESR"
unit = "Ω"
default = "20m"
min = 0
min_exclusive = true

[[params]]
key = "esl"
label = "ESL"
unit = "H"
default = "10n"
min = 0
min_exclusive = true

[[params]]
key = "rleak"
label = "Insulation resistance"
unit = "Ω"
default = "10G"
min = 0
min_exclusive = true

[sim.electrical]
device = "X"
line = "{dev} {a} {b} bench_cap_esr C={C} ESR={esr} ESL={esl} RLEAK={rleak}"
defs = ["models:passives/cap_esr.lib"]
model_kind = "equivalent"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; generic series-ESR/ESL equivalent with a high insulation resistance"
license = "MIT"
