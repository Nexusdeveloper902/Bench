[[params]]
key = "ron"
label = "On resistance"
unit = "Ω"
default = "470"
min = 0
min_exclusive = true
help = "Typical: 470 Ω at VDD = 5 V, 180 Ω at 10 V, 125 Ω at 15 V"

[sim.electrical]
device = "X"
line = "{dev} {y0} {y2} {ycom} {y3} {y1} {inh} {vee} {vss} {b} {a} {x3} {x0} {xcom} {x1} {x2} {vdd} bench_cd4052 RON={ron}"
defs = ["models:analog/aswitch.lib"]
body = """
.subckt bench_cd4052 y0 y2 ycom y3 y1 inh vee vss b a x3 x0 xcom x1 x2 vdd params: RON=470
* per section: INH (on while low), then the B and A levels; each of the 3 switches in a path has RON/3
XIX xcom xn inh vdd vss bench_asw_lo RON={RON/3}
XBX0 xn xb0 b vdd vss bench_asw_lo RON={RON/3}
XBX1 xn xb1 b vdd vss bench_asw_hi RON={RON/3}
XAX0 xb0 x0 a vdd vss bench_asw_lo RON={RON/3}
XAX1 xb0 x1 a vdd vss bench_asw_hi RON={RON/3}
XAX2 xb1 x2 a vdd vss bench_asw_lo RON={RON/3}
XAX3 xb1 x3 a vdd vss bench_asw_hi RON={RON/3}
XIY ycom yn inh vdd vss bench_asw_lo RON={RON/3}
XBY0 yn yb0 b vdd vss bench_asw_lo RON={RON/3}
XBY1 yn yb1 b vdd vss bench_asw_hi RON={RON/3}
XAY0 yb0 y0 a vdd vss bench_asw_lo RON={RON/3}
XAY1 yb0 y1 a vdd vss bench_asw_hi RON={RON/3}
XAY2 yb1 y2 a vdd vss bench_asw_lo RON={RON/3}
XAY3 yb1 y3 a vdd vss bench_asw_hi RON={RON/3}
Rvee vee vss 1e9
.ends bench_cd4052
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; trees of bench_asw switches decoding the address, on resistance from the CD405xB datasheet"
url = "https://www.ti.com/lit/ds/symlink/cd4051b.pdf"
version = "TI SCHS047O (CD4051B, CD4052B, CD4053B), August 1998, revised May 2026"
license = "MIT"
retrieved = "2026-10-11"
notes = "rON typical 470 ohm (VDD = 5 V), 180 ohm (10 V), 125 ohm (15 V); truth table: INH low, channel = 2B + A in both sections."
