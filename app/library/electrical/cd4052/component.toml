description = "Y channel 2 (pin 2)"

[[pins]]
id = "ycom"
name = "Y COM"
at = [120, 60]
description = "Y common (pin 3)"

[[pins]]
id = "y3"
name = "Y3"
at = [0, 180]
description = "Y channel 3 (pin 4)"

[[pins]]
id = "y1"
name = "Y1"
at = [0, 140]
description = "Y channel 1 (pin 5)"

[[pins]]
id = "inh"
name = "INH"
at = [120, 120]
description = "Inhibit, high = all off (pin 6)"

[[pins]]
id = "vee"
name = "VEE"
at = [80, 200]
description = "Analog negative supply (pin 7)"

[[pins]]
id = "vss"
name = "VSS"
at = [40, 200]
description = "Ground (pin 8)"

[[pins]]
id = "b"
name = "B"
