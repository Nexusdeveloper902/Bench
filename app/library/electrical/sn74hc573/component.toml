[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "45"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "15n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {oeb} {le} {d1} {d2} {d3} {d4} {d5} {d6} {d7} {d8} {q1} {q2} {q3} {q4} {q5} {q6} {q7} {q8} {vcc} {gnd} bench_74hc573 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/seq.lib"]
body = """
.subckt bench_74hc573 oeb le d1 d2 d3 d4 d5 d6 d7 d8 q1 q2 q3 q4 q5 q6 q7 q8 vc gn params: ROUT=45 TPD=15n
X1 vc gn d1 d2 d3 d4 d5 d6 d7 d8 le oeb q1 q2 q3 q4 q5 q6 q7 q8 bench_d_lat8  ROUT={ROUT} TPD={TPD}
.ends bench_74hc573
"""
model_kind = "behavioral"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74hc573a.pdf"
version = "TI SCLS147G, revised April 2022"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 2-6 V; Q follows D while LE is high, holds the value present when LE falls, outputs Hi-Z when OE is high; tpd (D to Q) about 11-16 ns typ at 4.5 V."
