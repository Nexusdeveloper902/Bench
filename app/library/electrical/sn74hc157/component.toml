format = 1
id = "SN74HC157"
version = 1
name = "74HC157 quad 2-to-1 data selector"
description = "Four digital 2-line to 1-line multiplexers with a common select and active-low enable (16 pins)."
designator = "U"
category = "Electrical"
subcategory = "Multiplexers"
aliases = ["74HC157", "SN74HC157", "HC157"]
keywords = ["SN74HC157", "HC157", "multiplexer", "data selector", "mux"]
tags = ["logic", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral model built from XSPICE digital code models behind analog bridges, not a vendor SPICE model: logic function is exact, electrical behavior is nominal.",
               "Inputs switch at about half the supply (guaranteed VIL 0.3 x VCC, VIH 0.7 x VCC lie inside the 0.45 to 0.55 x VCC band where the output goes unknown), outputs swing from GND to VCC through the ROUT parameter.",
               "Logic multiplexer: it passes logic levels only, not analog signals.",
               "Logic levels follow the supply pins: input thresholds and output swing scale with (VCC - GND), and the unknown region between the two input thresholds drives mid-level; supply current (static and dynamic), output current drawn from VCC, output current limit, input capacitance, clamp diodes and input leakage are not modelled.",
               "One nominal propagation delay (the TPD parameter plus about 2 ns of bridge delay), equal for rising and falling edges and independent of load and supply; setup time, hold time, minimum pulse width and metastability are not checked.",
               "Unconnected data and clock inputs read low (1 GΩ to GND); unconnected clear, preset, set, reset and load inputs read inactive and unconnected enable and output-enable inputs read enabled (1 GΩ to the rail). A real part leaves them undefined, so tie every input. Sequential parts power up with every output low, and a clock input that is already high at t = 0 produces one clock edge at power-up (the digital nodes start low)."]
docs = ["https://www.ti.com/lit/ds/symlink/sn74hc157.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 120, 260]
symbol = "symbol.svg"

[[pins]]
id = "s"
name = "A/B̅"
at = [0, 40]
description = "Select: low passes A inputs, high passes B inputs (pin 1)"

[[pins]]
id = "gb"
name = "G̅"
at = [0, 60]
description = "Enable, active low (pin 15)"

[[pins]]
id = "a1"
name = "1A"
at = [0, 80]
description = "Channel 1 input A (pin 2)"

[[pins]]
id = "b1"
name = "1B"
at = [0, 100]
description = "Channel 1 input B (pin 3)"

[[pins]]
id = "a2"
name = "2A"
at = [0, 120]
description = "Channel 2 input A (pin 5)"

[[pins]]
id = "b2"
name = "2B"
at = [0, 140]
description = "Channel 2 input B (pin 6)"

[[pins]]
id = "a3"
name = "3A"
at = [0, 160]
description = "Channel 3 input A (pin 11)"

[[pins]]
id = "b3"
name = "3B"
at = [0, 180]
description = "Channel 3 input B (pin 10)"

[[pins]]
id = "a4"
name = "4A"
at = [0, 200]
description = "Channel 4 input A (pin 14)"

[[pins]]
id = "b4"
name = "4B"
at = [0, 220]
description = "Channel 4 input B (pin 13)"

[[pins]]
id = "y1"
name = "1Y"
at = [120, 40]
description = "Channel 1 output (pin 4)"

[[pins]]
id = "y2"
name = "2Y"
at = [120, 60]
description = "Channel 2 output (pin 7)"

[[pins]]
id = "y3"
name = "3Y"
at = [120, 80]
description = "Channel 3 output (pin 9)"

[[pins]]
id = "y4"
name = "4Y"
at = [120, 100]
description = "Channel 4 output (pin 12)"

[[pins]]
id = "vcc"
name = "VCC"
at = [60, 0]
description = "Positive supply (pin 16)"

[[pins]]
id = "gnd"
name = "GND"
at = [60, 260]
description = "Ground (pin 8)"

[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "45"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "12n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {s} {gb} {a1} {b1} {a2} {b2} {a3} {b3} {a4} {b4} {y1} {y2} {y3} {y4} {vcc} {gnd} bench_74hc157 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/mux.lib"]
body = """
.subckt bench_74hc157 s gb a1 b1 a2 b2 a3 b3 a4 b4 y1 y2 y3 y4 vc gn params: ROUT=45 TPD=12n
X1 vc gn s gb a1 b1 y1 bench_d_mux2 ROUT={ROUT} TPD={TPD}
X2 vc gn s gb a2 b2 y2 bench_d_mux2 ROUT={ROUT} TPD={TPD}
X3 vc gn s gb a3 b3 y3 bench_d_mux2 ROUT={ROUT} TPD={TPD}
X4 vc gn s gb a4 b4 y4 bench_d_mux2 ROUT={ROUT} TPD={TPD}
.ends bench_74hc157
"""
model_kind = "behavioral"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74hc157.pdf"
version = "TI SCLS113F, revised February 2025"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 2-6 V; Y = A when select is low, B when high, Y low while G is high; tpd about 12 ns typ."
