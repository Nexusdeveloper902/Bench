format = 1
id = "MCP6002"
version = 1
name = "MCP6002 dual rail-to-rail CMOS op-amp"
description = "Dual 1.8-6 V CMOS op-amp with rail-to-rail output (8 pins), behavioural fit: GBW 1 MHz, 0.6 V/µs, 100 µA per amplifier, swing within 25 mV of each rail."
designator = "U"
category = "Electrical"
subcategory = "Analog ICs"
aliases = ["MCP6002", "MCP6001", "rail-to-rail op-amp"]
keywords = ["op amp", "dual", "rail-to-rail", "CMOS", "low power", "MCP6002", "operational amplifier"]
tags = ["analog", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral fit to datasheet typicals, not a vendor macromodel.",
               "Offset is 0 (the datasheet gives only ±4.5 mV limits); the ±23 mA short-circuit current and the rail-to-rail input stage's crossover are not modelled.",
               "The output current comes from the model's ground reference, not from the supply pins: the supply pins draw only the quiescent current IQ (and clamp current in saturation).",
               "No output short-circuit current limit, input common-mode range limit, input protection or phase reversal; inputs see 1 TΩ and the bias current only."]
docs = ["https://ww1.microchip.com/downloads/en/DeviceDoc/MCP6001-1R-1U-2-4-1-MHz-Low-Power-Op-Amp-DS20001733L.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 120]
symbol = "symbol.svg"

[[pins]]
id = "out1"
name = "OUT1"
at = [80, 40]
description = "Output A (pin 1)"

[[pins]]
id = "in1n"
name = "IN1-"
at = [0, 60]
description = "Inverting input A (pin 2)"

[[pins]]
id = "in1p"
name = "IN1+"
at = [0, 40]
description = "Non-inverting input A (pin 3)"

[[pins]]
id = "vee"
name = "V-"
at = [40, 120]
description = "Negative supply or ground (pin 4)"

[[pins]]
id = "in2p"
name = "IN2+"
at = [0, 80]
description = "Non-inverting input B (pin 5)"

[[pins]]
id = "in2n"
name = "IN2-"
at = [0, 100]
description = "Inverting input B (pin 6)"

[[pins]]
id = "out2"
name = "OUT2"
at = [80, 60]
description = "Output B (pin 7)"

[[pins]]
id = "vcc"
name = "V+"
at = [40, 0]
description = "Positive supply (pin 8)"

[sim.electrical]
device = "X"
line = "{dev} {out1} {in1n} {in1p} {vee} {in2p} {in2n} {out2} {vcc} bench_mcp6002"
defs = ["models:analog/opamp_macro.lib"]
body = """
.subckt bench_mcp6002 out1 in1n in1p vee in2p in2n out2 vcc
XA in1p in1n vcc vee out1 bench_opamp_macro AOL=400k GBW=1meg SR=0.6meg VOS=0 IB=1p ROUT=70 IQ=100u VDROPH=5m VDROPL=5m
XB in2p in2n vcc vee out2 bench_opamp_macro AOL=400k GBW=1meg SR=0.6meg VOS=0 IB=1p ROUT=70 IQ=100u VDROPH=5m VDROPL=5m
.ends bench_mcp6002
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; two bench_opamp_macro instances with parameters fitted to the MCP6002 datasheet typical values"
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/MCP6001-1R-1U-2-4-1-MHz-Low-Power-Op-Amp-DS20001733L.pdf"
version = "Microchip DS20001733L (2002-2020)"
license = "MIT"
retrieved = "2026-10-11"
notes = "Typicals at VDD = 1.8-5.5 V: AOL 112 dB; GBW 1.0 MHz; SR 0.6 V/us; IB 1 pA; IQ 100 uA per amplifier; output swing VSS + 25 mV to VDD - 25 mV (limit, RL = 10 kohm to VDD/2). VOS is only specified as +-4.5 mV max, so the model uses 0. VDROP 5 mV + ROUT 70 ohm keep the swing inside 25 mV at that load (fit; output resistance not listed)."
