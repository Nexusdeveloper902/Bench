limitations = ["Project-authored fit to the Infineon datasheet, not a vendor SPICE model: threshold 3.0 V (250 uA), RDS(on) 36 mohm at 10 V / 16 A (maximum 44 mohm), gfs about 22 S at 16 A, gate charge about 60 nC (maximum 71 nC).",
               "Gate-drain capacitance varies between 40 pF (at high VDS, the datasheet Crss) and 4.4 nF (at low VDS, chosen so the simulated total gate charge is about 60 nC). Body diode: 1.0 V at 16 A (maximum 1.2 V); its reverse-recovery charge is not modelled.",
               "Three-pin VDMOS model (body tied to source) with an integral body diode. The gate has no DC path, so drive it through a resistor or a voltage source. Temperature dependence, avalanche energy, safe operating area and self-heating are not modelled."]
