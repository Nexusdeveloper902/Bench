[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "9n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {oe1} {a1} {a2} {a3} {a4} {oe2} {a5} {a6} {a7} {a8} {y1} {y2} {y3} {y4} {y5} {y6} {y7} {y8} {vcc} {gnd} bench_74hc244 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/gates.lib"]
body = """
.subckt bench_74hc244 oe1 a1 a2 a3 a4 oe2 a5 a6 a7 a8 y1 y2 y3 y4 y5 y6 y7 y8 vc gn params: ROUT=45 TPD=9n
X1 vc gn a1 oe1 y1 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X2 vc gn a2 oe1 y2 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X3 vc gn a3 oe1 y3 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X4 vc gn a4 oe1 y4 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X5 vc gn a5 oe2 y5 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X6 vc gn a6 oe2 y6 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X7 vc gn a7 oe2 y7 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
X8 vc gn a8 oe2 y8 bench_d_tbuf  ROUT={ROUT} TPD={TPD}
.ends bench_74hc244
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74hc244.pdf"
version = "TI SCLS130I, revised February 2026"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 2-6 V; each group follows its inputs while its OE is low and is Hi-Z while OE is high; +-6 mA output drive at 4.5 V; tpd about 9 ns typ."
