format = 1
id = "ADC_4BIT"
version = 1
name = "Generic 4-bit sampling ADC"
description = "Generic 4-bit analog-to-digital converter: on each rising clock edge it registers floor(16 x VIN / VREF), limited to 0-15, on 4 logic outputs."
designator = "U"
label = "ADC"
category = "Electrical"
subcategory = "Data converters"
aliases = ["ADC_4BIT", "4-bit ADC"]
keywords = ["ADC", "4-bit ADC", "converter", "analog to digital", "sampling"]
tags = ["logic", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral model built from XSPICE digital code models behind analog bridges, not a vendor SPICE model: logic function is exact, electrical behavior is nominal.",
               "Inputs switch at about half the supply (guaranteed VIL 0.3 x VCC, VIH 0.7 x VCC lie inside the 0.45 to 0.55 x VCC band where the output goes unknown), outputs swing from GND to VCC through the ROUT parameter.",
               "Ideal quantiser: no offset, gain, linearity, noise or sample-and-hold aperture error; the input is read at the clock edge with about 2 ns of bridge delay. Resolution is fixed at 4 bits because a part's pin count cannot depend on a parameter; ADC_4BIT, ADC_8BIT, ADC_10BIT and ADC_12BIT are the same model at four widths.",
               "Not a named part: no real converter has the 0 to REF transfer exactly like this (the ADC0804, for instance, adds a start/read handshake and a half-LSB offset).",
               "Logic levels follow the supply pins: input thresholds and output swing scale with (VCC - GND), and the unknown region between the two input thresholds drives mid-level; supply current (static and dynamic), output current drawn from VCC, output current limit, input capacitance, clamp diodes and input leakage are not modelled.",
               "One nominal propagation delay (the TPD parameter plus about 2 ns of bridge delay), equal for rising and falling edges and independent of load and supply; setup time, hold time, minimum pulse width and metastability are not checked.",
               "Unconnected data and clock inputs read low (1 GΩ to GND); unconnected clear, preset, set, reset and load inputs read inactive and unconnected enable and output-enable inputs read enabled (1 GΩ to the rail). A real part leaves them undefined, so tie every input. Sequential parts power up with every output low. The clock input has a power-on gate: an edge counts only after the clock has been seen at its idle level, so a clock tied or held at its active level from t = 0 (for a rising-edge part, high) gives no edge at power-up, and the first real edge counts; an edge within about 5 ns of t = 0 is ignored."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 120, 140]
symbol = "symbol.svg"

[[pins]]
id = "vin"
name = "VIN"
at = [0, 40]
description = "Analog input, sampled on the rising clock edge"

[[pins]]
id = "ref"
name = "REF"
at = [0, 60]
description = "Reference: full scale is REF (code 15 at REF - 1 LSB)"

[[pins]]
id = "clk"
name = "CLK"
at = [0, 80]
description = "Sample clock, rising edge starts a conversion"

[[pins]]
id = "d0"
name = "D0"
at = [120, 40]
description = "Output bit 0 (least significant)"

[[pins]]
id = "d1"
name = "D1"
at = [120, 60]
description = "Output bit 1"

[[pins]]
id = "d2"
name = "D2"
at = [120, 80]
description = "Output bit 2"

[[pins]]
id = "d3"
name = "D3"
at = [120, 100]
description = "Output bit 3 (most significant)"

[[pins]]
id = "vcc"
name = "VCC"
at = [60, 0]
description = "Positive supply"

[[pins]]
id = "gnd"
name = "GND"
at = [60, 140]
description = "Ground and logic low reference"

[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "45"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "50n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {vin} {ref} {clk} {d0} {d1} {d2} {d3} {vcc} {gnd} bench_adc4 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/conv.lib"]
body = """
.subckt bench_adc4 vin ref clk d0 d1 d2 d3 vc gn params: ROUT=45 TPD=50n
X1 vc gn vin ref clk d0 d1 d2 d3 bench_d_adc4 ROUT={ROUT} TPD={TPD}
.ends bench_adc4
"""
model_kind = "behavioral"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; behavioural quantiser (floor of the scaled input) read through 4 adc_bridge elements and registered by 4 d_dff"
version = "not applicable"
license = "MIT"
retrieved = "2026-10-12"
notes = "Generic model, no datasheet. Output code = floor(16 * (VIN - GND) / (REF - GND)) limited to 0..15, taken at each rising CLK edge."
