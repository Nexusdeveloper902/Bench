[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "400"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "60n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {a1} {a2} {a3} {a4} {a5} {a6} {y1} {y2} {y3} {y4} {y5} {y6} {vdd} {vss} bench_cd40106 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/gates.lib"]
body = """
.subckt bench_cd40106 a1 a2 a3 a4 a5 a6 y1 y2 y3 y4 y5 y6 vc gn params: ROUT=400 TPD=60n
X1 vc gn a1 y1 bench_d_sinv VP=0.6 VN=0.38 ROUT={ROUT} TPD={TPD}
X2 vc gn a2 y2 bench_d_sinv VP=0.6 VN=0.38 ROUT={ROUT} TPD={TPD}
X3 vc gn a3 y3 bench_d_sinv VP=0.6 VN=0.38 ROUT={ROUT} TPD={TPD}
X4 vc gn a4 y4 bench_d_sinv VP=0.6 VN=0.38 ROUT={ROUT} TPD={TPD}
X5 vc gn a5 y5 bench_d_sinv VP=0.6 VN=0.38 ROUT={ROUT} TPD={TPD}
X6 vc gn a6 y6 bench_d_sinv VP=0.6 VN=0.38 ROUT={ROUT} TPD={TPD}
.ends bench_cd40106
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/cd40106b.pdf"
version = "TI SCHS097F, revised March 2017"
license = "MIT"
retrieved = "2026-10-12"
notes = "VDD 3-18 V; hysteresis 0.9 V typ at 5 V, 2.3 V at 10 V and 3.5 V at 15 V (about 0.18-0.23 x VDD); tPLH/tPHL 70 ns typ at 10 V."
