format = 1
id = "VCCS"
version = 1
name = "Voltage-controlled current source (G)"
description = "Linear voltage-controlled current source: I = gm * V(cp, cn), pushed from on to op through the source. Ideal, infinite output resistance."
designator = "G"
category = "Electrical"
subcategory = "Sources"
aliases = ["VCCS", "G source", "transconductance"]
keywords = ["controlled", "dependent", "transconductance", "gm", "linear"]
tags = ["source", "controlled"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Ideal and linear: no output limit, no saturation, no bandwidth limit."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 60]
symbol = "symbol.svg"
value = "gain"

[[pins]]
id = "op"
name = "OUT+"
at = [80, 10]

[[pins]]
id = "on"
name = "OUT-"
at = [80, 50]

[[pins]]
id = "cp"
name = "IN+"
at = [0, 10]

[[pins]]
id = "cn"
name = "IN-"
at = [0, 50]

[[params]]
key = "gain"
label = "Transconductance (A/V)"
default = "1m"

[sim.electrical]
device = "G"
line = "{dev} {op} {on} {cp} {cn} {gain}"
current = "@{dev_lc}[i]"
model_kind = "primitive"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; ngspice linear G element"
license = "MIT"
