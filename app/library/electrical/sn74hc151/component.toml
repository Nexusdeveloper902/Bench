format = 1
id = "SN74HC151"
version = 1
name = "74HC151 8-to-1 data selector"
description = "Digital 8-line to 1-line multiplexer with active-low enable and complementary outputs (16 pins). Not the analog switch multiplexer (see CD4051)."
designator = "U"
category = "Electrical"
subcategory = "Multiplexers"
aliases = ["74HC151", "SN74HC151", "HC151"]
keywords = ["SN74HC151", "HC151", "multiplexer", "data selector", "mux"]
tags = ["logic", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral model built from XSPICE digital code models behind analog bridges, not a vendor SPICE model: logic function is exact, electrical behavior is nominal.",
               "Inputs switch at about half the supply (guaranteed VIL 0.3 x VCC, VIH 0.7 x VCC lie inside the 0.45 to 0.55 x VCC band where the output goes unknown), outputs swing from GND to VCC through the ROUT parameter.",
               "Logic multiplexer: it passes logic levels only, not analog signals.",
               "Logic levels follow the supply pins: input thresholds and output swing scale with (VCC - GND), and the unknown region between the two input thresholds drives mid-level; supply current (static and dynamic), output current drawn from VCC, output current limit, input capacitance, clamp diodes and input leakage are not modelled.",
               "One nominal propagation delay (the TPD parameter plus about 2 ns of bridge delay), equal for rising and falling edges and independent of load and supply; setup time, hold time, minimum pulse width and metastability are not checked.",
               "Unconnected data and clock inputs read low (1 GΩ to GND); unconnected clear, preset, set, reset and load inputs read inactive and unconnected enable and output-enable inputs read enabled (1 GΩ to the rail). A real part leaves them undefined, so tie every input. Sequential parts power up with every output low, and a clock input that is already high at t = 0 produces one clock edge at power-up (the digital nodes start low)."]
docs = ["https://www.ti.com/lit/ds/symlink/sn74hc151.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 120, 300]
symbol = "symbol.svg"

[[pins]]
id = "d0"
name = "D0"
at = [0, 40]
description = "Data input 0 (pin 4)"

[[pins]]
id = "d1"
name = "D1"
at = [0, 60]
description = "Data input 1 (pin 3)"

[[pins]]
id = "d2"
name = "D2"
at = [0, 80]
description = "Data input 2 (pin 2)"

[[pins]]
id = "d3"
name = "D3"
at = [0, 100]
description = "Data input 3 (pin 1)"

[[pins]]
id = "d4"
name = "D4"
at = [0, 120]
description = "Data input 4 (pin 15)"

[[pins]]
id = "d5"
name = "D5"
at = [0, 140]
description = "Data input 5 (pin 14)"

[[pins]]
id = "d6"
name = "D6"
at = [0, 160]
description = "Data input 6 (pin 13)"

[[pins]]
id = "d7"
name = "D7"
at = [0, 180]
description = "Data input 7 (pin 12)"

[[pins]]
id = "a"
name = "A"
at = [0, 200]
description = "Select, least significant (pin 11)"

[[pins]]
id = "b"
name = "B"
at = [0, 220]
description = "Select (pin 10)"

[[pins]]
id = "c"
name = "C"
at = [0, 240]
description = "Select, most significant (pin 9)"

[[pins]]
id = "gb"
name = "G̅"
at = [0, 260]
description = "Enable, active low (pin 7)"

[[pins]]
id = "y"
name = "Y"
at = [120, 40]
description = "Output: the selected data input (pin 5)"

[[pins]]
id = "w"
name = "W"
at = [120, 60]
description = "Complementary output (pin 6)"

[[pins]]
id = "vcc"
name = "VCC"
at = [60, 0]
description = "Positive supply (pin 16)"

[[pins]]
id = "gnd"
name = "GND"
at = [60, 300]
description = "Ground (pin 8)"

[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "45"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "20n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {d0} {d1} {d2} {d3} {d4} {d5} {d6} {d7} {a} {b} {c} {gb} {y} {w} {vcc} {gnd} bench_74hc151 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/mux.lib"]
body = """
.subckt bench_74hc151 d0 d1 d2 d3 d4 d5 d6 d7 a b c gb y w vc gn params: ROUT=45 TPD=20n
X1 vc gn d0 d1 d2 d3 d4 d5 d6 d7 a b c gb y w bench_d_mux8 ROUT={ROUT} TPD={TPD}
.ends bench_74hc151
"""
model_kind = "behavioral"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74hc151.pdf"
version = "TI SCLS110F, revised February 2022"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 2-6 V; Y = D(CBA) while G is low, Y low and W high while G is high; tpd about 20 ns typ."
