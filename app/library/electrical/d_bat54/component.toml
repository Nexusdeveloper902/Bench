format = 1
id = "D_BAT54"
version = 1
name = "BAT54 Schottky diode"
description = "Small-signal 30 V, 200 mA Schottky: 0.28 V at 1 mA, 0.38 V at 10 mA, 0.62 V at 100 mA, about 10 pF."
designator = "D"
category = "Electrical"
subcategory = "Diodes"
aliases = ["BAT54", "Schottky signal diode"]
keywords = ["schottky", "small signal", "diode", "BAT54", "clamp", "detector"]
tags = ["semiconductor"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Project-authored fit to the STMicroelectronics datasheet maxima, not a vendor SPICE model: the curve passes below every listed maximum (0.20 V at 0.1 mA, 0.28 V at 1 mA, 0.38 V at 10 mA, 0.45 V at 30 mA, 0.62 V at 100 mA).",
               "Leakage below the 30 V rating is the saturation current (about 0.3 uA; datasheet maximum 1 uA). ngspice silently raises the card's IBV (0.7 uA) to Is·BV/Vt = 0.38 mA, so the knee current at 30 V is 0.38 mA (validator warning MODEL-IBV). Junction capacitance is 10 pF at 1 V. Reverse recovery is not modelled (the datasheet's 5 ns is below this model's resolution).",
               "Temperature dependence, noise and self-heating are not modelled."]
docs = ["https://sy-dep-epc-lpc.web.cern.ch/components/datasheets/epc-lpc%20(converters)/BAT54%20Diode%20(ST).pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 30]
symbol = "symbol.svg"
show_current = true

[[pins]]
id = "a"
name = "Anode"
at = [0, 15]

[[pins]]
id = "k"
name = "Cathode"
at = [60, 15]

[sim.electrical]
device = "D"
line = "{dev} {a} {k} dbat54"
