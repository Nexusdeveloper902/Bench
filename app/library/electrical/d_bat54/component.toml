current = "@{dev_lc}[id]"
model_kind = "model"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; parameter set fitted to the STMicroelectronics BAT54 datasheet values"
url = "https://sy-dep-epc-lpc.web.cern.ch/components/datasheets/epc-lpc%20(converters)/BAT54%20Diode%20(ST).pdf"
version = "STMicroelectronics BAT54 datasheet (copy hosted at CERN)"
license = "MIT"
retrieved = "2026-10-11"
notes = "Targets (max): VF 0.24 V at 0.1 mA, 0.32 V at 1 mA, 0.40 V at 10 mA, 0.50 V at 30 mA, 0.90 V at 100 mA; IR <= 1 uA at 30 V; C = 10 pF at 1 V, 1 MHz. The model sits below every forward maximum."
