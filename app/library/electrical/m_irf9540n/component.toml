limitations = ["Project-authored fit to the Infineon datasheet, not a vendor SPICE model: threshold -3.0 V (250 uA), RDS(on) 99 mohm at -10 V / -11 A (maximum 117 mohm), gfs about 6.8 S at -11 A, gate charge about 82 nC (maximum 97 nC).",
               "Gate-drain capacitance varies between 240 pF (datasheet Crss, at high VDS) and 8 nF (at low VDS, chosen so the simulated total gate charge is about 82 nC). Body diode 0.95 V at 11 A (maximum 1.6 V); reverse recovery is not modelled.",
               "Three-pin VDMOS model (body tied to source) with an integral body diode. The gate has no DC path, so drive it through a resistor or a voltage source. Temperature dependence, avalanche energy, safe operating area and self-heating are not modelled."]
