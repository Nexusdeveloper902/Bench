format = 1
id = "VSRC_EXP_SFFM"
version = 1
name = "Voltage source: exponential or FM"
description = "Independent voltage source with an exponential rise-and-decay (EXP) or frequency-modulated (SFFM) waveform. Pulse and sine are on the Voltage source part."
designator = "V"
category = "Electrical"
subcategory = "Sources"
aliases = ["exponential source", "FM source", "modulated source"]
keywords = ["exp", "sffm", "fm", "transient", "waveform", "source"]
tags = ["source"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Only the transient waveform is defined (no AC magnitude). Parameters are not checked against each other (for example td2 after td1)."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 30]
symbol = "symbol.svg"
value = "mode"

[[pins]]
id = "p"
name = "Positive"
at = [0, 15]

[[pins]]
id = "n"
name = "Negative"
at = [60, 15]

[[params]]
key = "mode"
label = "Waveform"
default = "EXP"
kind = "choice"
choices = ["EXP", "SFFM"]

[[params]]
key = "v1"
label = "Initial value"
unit = "V"
default = "0"
when = { mode = "EXP" }

[[params]]
key = "v2"
label = "Peak value"
unit = "V"
default = "5"
when = { mode = "EXP" }

[[params]]
key = "td1"
label = "Rise delay"
unit = "s"
default = "0"
min = 0
when = { mode = "EXP" }

[[params]]
key = "tau1"
label = "Rise time constant"
unit = "s"
default = "1m"
min = 0
min_exclusive = true
when = { mode = "EXP" }

[[params]]
key = "td2"
label = "Fall delay"
unit = "s"
default = "2m"
min = 0
when = { mode = "EXP" }

[[params]]
key = "tau2"
label = "Fall time constant"
unit = "s"
default = "3m"
min = 0
min_exclusive = true
when = { mode = "EXP" }

[[params]]
key = "vo"
label = "Offset"
unit = "V"
default = "0"
when = { mode = "SFFM" }

[[params]]
key = "va"
label = "Amplitude"
unit = "V"
default = "1"
when = { mode = "SFFM" }

[[params]]
key = "fc"
label = "Carrier frequency"
unit = "Hz"
default = "1k"
min = 0
min_exclusive = true
when = { mode = "SFFM" }

[[params]]
key = "mdi"
label = "Modulation index"
default = "5"
min = 0
when = { mode = "SFFM" }

[[params]]
key = "fs"
label = "Signal frequency"
unit = "Hz"
default = "100"
min = 0
min_exclusive = true
when = { mode = "SFFM" }

[sim.electrical]
device = "V"
current = "i({dev_lc})"
model_kind = "primitive"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; ngspice EXP and SFFM source syntax"
license = "MIT"

[sim.electrical.line]
select = "mode"
EXP = "{dev} {p} {n} EXP({v1} {v2} {td1} {tau1} {td2} {tau2})"
SFFM = "{dev} {p} {n} SFFM({vo} {va} {fc} {mdi} {fs})"
