[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "400"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "30n"
min = 0
min_exclusive = true
help = "Nominal delay of the gate itself; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {a1} {a2} {a3} {a4} {a5} {a6} {y1} {y2} {y3} {y4} {y5} {y6} {vdd} {vss} bench_cd4069 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/gates.lib"]
body = """
.subckt bench_cd4069 a1 a2 a3 a4 a5 a6 y1 y2 y3 y4 y5 y6 vc gn params: ROUT=400 TPD=30n
X1 vc gn a1 y1 bench_d_inv ROUT={ROUT} TPD={TPD}
X2 vc gn a2 y2 bench_d_inv ROUT={ROUT} TPD={TPD}
X3 vc gn a3 y3 bench_d_inv ROUT={ROUT} TPD={TPD}
X4 vc gn a4 y4 bench_d_inv ROUT={ROUT} TPD={TPD}
X5 vc gn a5 y5 bench_d_inv ROUT={ROUT} TPD={TPD}
X6 vc gn a6 y6 bench_d_inv ROUT={ROUT} TPD={TPD}
.ends bench_cd4069
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; XSPICE d_inv behind bench_din/bench_dout bridges, pinout and levels from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/cd4069ub.pdf"
version = "TI SCHS054E, revised January 2019"
license = "MIT"
retrieved = "2026-10-12"
notes = "VDD 3-18 V; guaranteed VIL 0.3 x VDD and VIH 0.7 x VDD; output about 0.05 V from the rail at no load, 4-15 mA class drive at 5-15 V (a few hundred ohms); tpd tens of ns (65 ns typ at 10 V for CD4070B). The UB part is unbuffered: tpd 30 ns typ at 10 V."
