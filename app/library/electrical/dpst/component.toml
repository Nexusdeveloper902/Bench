format = 1
id = "DPST"
version = 1
name = "DPST switch"
description = "Double-pole single-throw manual switch: two contacts (a1-b1 and a2-b2) that open and close together."
designator = "SW"
label = "DPST"
category = "Electrical"
subcategory = "Switches"
aliases = ["double pole single throw", "two-pole switch"]
keywords = ["switch", "two pole", "contact", "subcircuit"]
tags = ["manual"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Static: the state is set in the inspector and does not change during a run.",
               "Contacts are resistors (on and off values); no bounce, capacitance or leakage."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 60]
symbol = "symbol.svg"

[[pins]]
id = "a1"
name = "1A"
at = [0, 15]

[[pins]]
id = "b1"
name = "1B"
at = [80, 15]

[[pins]]
id = "a2"
name = "2A"
at = [0, 45]

[[pins]]
id = "b2"
name = "2B"
at = [80, 45]

[[params]]
key = "state"
label = "State"
default = "open"
kind = "choice"
choices = ["open", "closed"]

[[params]]
key = "ron"
label = "On resistance"
unit = "Ω"
default = "0.01"
min = 0
min_exclusive = true

[[params]]
key = "roff"
label = "Off resistance"
unit = "Ω"
default = "1G"
min = 0
min_exclusive = true

[sim.electrical]
live = ["state"]
device = "X"
body = """
.subckt bench_dpst a1 b1 a2 b2 params: RC=1e9
R1 a1 b1 {RC}
R2 a2 b2 {RC}
.ends bench_dpst
"""
model_kind = "project-subckt"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; two resistive contacts switched together"
license = "MIT"

[sim.electrical.line]
select = "state"
open = "{dev} {a1} {b1} {a2} {b2} bench_dpst RC={roff}"
closed = "{dev} {a1} {b1} {a2} {b2} bench_dpst RC={ron}"
