limitations = ["Project-authored fit to the Infineon datasheet, not a vendor SPICE model: threshold 1.5 V (250 uA), RDS(on) 21 mohm at 5 V / 25 A (maximum 25 mohm), gfs about 30 S at 25 A, gate charge about 41 nC at 5 V (maximum 48 nC).",
               "Gate-drain capacitance varies between 150 pF (datasheet Crss, at high VDS) and 7.9 nF (at low VDS, chosen so the simulated gate charge to 5 V is about 41 nC). Body diode 1.1 V at 25 A (maximum 1.3 V); reverse recovery is not modelled.",
               "Three-pin VDMOS model (body tied to source) with an integral body diode. The gate has no DC path, so drive it through a resistor or a voltage source. Temperature dependence, avalanche energy, safe operating area and self-heating are not modelled."]
