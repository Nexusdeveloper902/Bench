format = 1
id = "CAP_TANTALUM"
version = 1
name = "Tantalum capacitor (ESR/ESL)"
description = "Solid tantalum capacitor: high capacitance per volume, low leakage, modest ESR. Generic values; polarised in practice."
designator = "C"
category = "Electrical"
subcategory = "Passives"
aliases = ["tantalum", "solid tantalum", "tant cap"]
keywords = ["capacitor", "tantalum", "ESR", "ESL", "polarised", "subcircuit"]
tags = ["passive", "polarised"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Polarity is not enforced: reverse bias and the failure mode are not modelled.",
               "Generic: no surge-current limit, ESR frequency dependence or dielectric absorption."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 40]
symbol = "symbol.svg"

[[pins]]
id = "a"
name = "+"
at = [0, 20]

[[pins]]
id = "b"
name = "-"
at = [80, 20]

[[params]]
key = "C"
label = "Capacitance"
unit = "F"
default = "10u"
min = 0
min_exclusive = true

[[params]]
key = "esr"
label = "ESR"
unit = "Ω"
default = "0.2"
min = 0
min_exclusive = true

[[params]]
key = "esl"
label = "ESL"
unit = "H"
default = "2n"
min = 0
min_exclusive = true

[[params]]
key = "rleak"
label = "Leakage resistance"
unit = "Ω"
default = "10meg"
min = 0
min_exclusive = true

[sim.electrical]
device = "X"
line = "{dev} {a} {b} bench_cap_esr C={C} ESR={esr} ESL={esl} RLEAK={rleak}"
defs = ["models:passives/cap_esr.lib"]
model_kind = "equivalent"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; generic series-ESR/ESL equivalent with a leakage resistance"
license = "MIT"
