format = 1
id = "AMS1117"
version = 1
name = "AMS1117 low-dropout regulator"
description = "1 A low-dropout fixed regulator (AMS1117-1.5 ... -5.0) with the output voltage as a choice: 1.1-1.3 V dropout at 0.8 A, 5 mA quiescent current, current limit about 1.1 A."
designator = "U"
category = "Electrical"
subcategory = "Regulators"
aliases = ["AMS1117", "AMS1117-3.3", "LM1117", "LDO"]
keywords = ["regulator", "LDO", "low dropout", "AMS1117", "3.3 V", "power supply"]
tags = ["power", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral fit to datasheet typicals, not a vendor macromodel.",
               "Pass transistors are generic Darlington models with an ideal reference and error amplifier: no thermal shutdown, safe-area protection, foldback, ripple-rejection roll-off or temperature drift.",
               "Line and load regulation are better than the datasheet (no internal sense resistance); a supply step at start-up overshoots the output by up to about 0.6 V before it settles.",
               "Fixed-output versions only (no ADJ version); the dropout floor is about 1.3 V at 0.8 A (datasheet: 1.1 V typical, 1.3 V maximum).",
               "The datasheet's output-capacitor (ESR) stability requirement is not reproduced: the model is stable without a capacitor."]
docs = ["http://www.advanced-monolithic.com/pdf/ds1117.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 80]
symbol = "symbol.svg"

[[pins]]
id = "gnd"
name = "GND"
at = [40, 80]
description = "Ground (pin 1)"

[[pins]]
id = "out"
name = "OUT"
at = [80, 40]
description = "Output (pin 2, tab)"

[[pins]]
id = "in"
name = "IN"
at = [0, 40]
description = "Input (pin 3)"

[[params]]
key = "vout"
label = "Output voltage"
unit = "V"
kind = "choice"
choices = ["1.5", "1.8", "2.5", "2.85", "3.3", "5.0"]
default = "3.3"

[sim.electrical]
device = "X"
line = "{dev} {gnd} {out} {in} bench_ams1117 VOUT={vout}"
defs = ["models:analog/linreg.lib"]
body = """
.subckt bench_ams1117 gn out in params: VOUT=3.3
X1 in out gn gn bench_linreg_pos VREF={VOUT} VHD=-0.5 IQ=5m RSC=0.62
.ends bench_ams1117
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; bench_linreg_pos with parameters fitted to the AMS1117 datasheet typical values"
url = "http://www.advanced-monolithic.com/pdf/ds1117.pdf"
version = "Advanced Monolithic Systems AMS1117 datasheet (ds1117.pdf; no revision printed)"
license = "MIT"
retrieved = "2026-10-11"
notes = "Typicals: dropout 1.1 V (max 1.3 V) at 0.8 A; current limit 1.1 A (0.9-1.5 A); quiescent current 5 mA; load regulation 0.1 %. Fit: VHD -0.5 V lets the base drive rise above the input (as the IC's drive stage does), RSC 0.62 ohm limits near 1.1 A."
