format = 1
id = "ULN2003"
version = 1
name = "ULN2003A Darlington transistor array"
description = "Seven NPN Darlington sinks with 2.7 kΩ input resistors (5 V logic inputs) and flyback clamp diodes to COM: 500 mA per channel, about 1 V saturation at 200 mA."
designator = "U"
category = "Electrical"
subcategory = "Drivers"
aliases = ["ULN2003", "ULN2003A", "Darlington array"]
keywords = ["driver", "darlington", "relay driver", "stepper", "ULN2003", "sink"]
tags = ["driver", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Project-authored transistor-level subcircuit (not a vendor SPICE model) using the datasheet's 2.7 kΩ / 7.2 kΩ / 3 kΩ resistor network; two transistor models fitted to the saturation and clamp-diode rows.",
               "No substrate diodes, collector-emitter breakdown (50 V), thermal limits or switching-time fit."]
docs = ["https://www.ti.com/lit/ds/symlink/uln2003a.pdf", "https://ngspice.sourceforge.io/docs.html"]

