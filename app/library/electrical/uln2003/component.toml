[sim.electrical]
device = "X"
line = "{dev} {in1} {in2} {in3} {in4} {in5} {in6} {in7} {e} {com} {o7} {o6} {o5} {o4} {o3} {o2} {o1} bench_uln2003"
body = """
.subckt bench_uln2003 in1 in2 in3 in4 in5 in6 in7 e com o7 o6 o5 o4 o3 o2 o1
.subckt bench_uln_ch in out e com
* one channel: 2.7 kohm base resistor, 7.2 kohm and 3 kohm base-emitter resistors, clamp diode to COM
.model bench_uln_q1 NPN(Is=1e-14 Bf=100 Rc=2 Vaf=100)
.model bench_uln_q2 NPN(Is=1e-13 Bf=60 Rc=0.3 Re=1.0 Ikf=1 Vaf=100)
.model bench_uln_dc D(Is=1e-10 N=2 Rs=1.6)
Rin in b1 2.7k
R1 b1 b2 7.2k
R2 b2 e 3k
Q1 out b1 b2 bench_uln_q1
Q2 out b2 e bench_uln_q2
Dc out com bench_uln_dc
.ends bench_uln_ch
X1 in1 o1 e com bench_uln_ch
X2 in2 o2 e com bench_uln_ch
X3 in3 o3 e com bench_uln_ch
X4 in4 o4 e com bench_uln_ch
X5 in5 o5 e com bench_uln_ch
X6 in6 o6 e com bench_uln_ch
X7 in7 o7 e com bench_uln_ch
.ends bench_uln2003
"""
model_kind = "project-subckt"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; Darlington channel subcircuit fitted to the ULN2003A datasheet"
url = "https://www.ti.com/lit/ds/symlink/uln2003a.pdf"
version = "TI SLRS027T, December 1976, revised March 2025 (sections 5.6 and 7.2)"
license = "MIT"
retrieved = "2026-10-11"
notes = "Targets: VCE(sat) 0.9 V at 100 mA (II = 250 uA), 1.0 V at 200 mA (350 uA), 1.2 V at 350 mA (500 uA); input current 0.93 mA at VI = 3.85 V; clamp diode VF 1.7 V at 350 mA; internal 2.7 k / 7.2 k / 3 k resistors from the block diagram."
