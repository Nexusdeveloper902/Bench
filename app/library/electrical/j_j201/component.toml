format = 1
id = "J_J201"
version = 1
name = "J201 N-channel JFET"
description = "Low-IDSS N-channel JFET for low-noise preamplifiers: IDSS about 0.5 mA, pinch-off about -0.8 V."
designator = "Q"
category = "Electrical"
subcategory = "JFETs"
aliases = ["J201", "SST201"]
keywords = ["jfet", "fet", "n-channel", "J201", "low noise", "preamp", "audio", "guitar"]
tags = ["JFET", "semiconductor"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Project-authored fit to the datasheet window, not a vendor SPICE model: IDSS 0.5 mA at VDS = 20 V (window 0.2-1.0 mA), Vto -0.8 V (window -0.3 to -1.5 V), gm about 1.2 mS (minimum 0.5 mS). Real parts vary between lots; IDSS and Vto are correlated.",
               "Cgs = 2.5 pF and Cgd = 2 pF (Ciss about 4.5 pF).",
               "Level-1 (Shichman-Hodges) JFET: drain current Beta (VGS - Vto)^2 (1 + Lambda VDS). Lambda = 0.01 /V is an assumption (the datasheet gives no output conductance).",
               "The gate must have a DC path to a defined voltage (the gate is a junction, not insulated). Gate leakage, noise and temperature dependence are not modelled."]
docs = ["https://my.centralsemi.com/datasheets/J201.PDF", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 60]
symbol = "symbol.svg"
show_current = true

[[pins]]
id = "g"
name = "Gate"
at = [0, 30]

[[pins]]
id = "d"
name = "Drain"
at = [40, 0]

[[pins]]
id = "s"
name = "Source"
at = [40, 60]

[sim.electrical]
device = "J"
line = "{dev} {d} {g} {s} jj201"
models = [".model jj201 NJF(Vto=-0.8 Beta=651u Lambda=0.01 Cgs=2.5p Cgd=2p)"]
current = "@{dev_lc}[id]"
model_kind = "model"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; JFET parameter set fitted to the Central datasheet values"
url = "https://my.centralsemi.com/datasheets/J201.PDF"
version = "Central Semiconductor J201 datasheet"
license = "MIT"
retrieved = "2026-10-11"
notes = "Targets: IDSS 0.2-1.0 mA (VDS=20 V, VGS=0); VGS(off) -0.3 to -1.5 V (ID=10 nA); gfs >= 0.5 mS (1 kHz); Ciss 5 pF, Crss 2 pF. The model uses the mid-range pair IDSS = 0.5 mA, Vto = -0.8 V."
