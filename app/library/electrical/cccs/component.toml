format = 1
id = "CCCS"
version = 1
name = "Current-controlled current source (F)"
description = "Linear current-controlled current source: the output current is gain times the current through the sense pins cp-cn, which are a 0 V sense path."
designator = "F"
category = "Electrical"
subcategory = "Sources"
aliases = ["CCCS", "F source", "current amplifier"]
keywords = ["controlled", "dependent", "current gain", "sense", "linear"]
tags = ["source", "controlled"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Ideal and linear. The sense path is a 0 V source, so it does not disturb the circuit it is in series with."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 60]
symbol = "symbol.svg"
value = "gain"

[[pins]]
id = "op"
name = "OUT+"
at = [80, 10]

[[pins]]
id = "on"
name = "OUT-"
at = [80, 50]

[[pins]]
id = "cp"
name = "SENSE+"
at = [0, 10]

[[pins]]
id = "cn"
name = "SENSE-"
at = [0, 50]

[[params]]
key = "gain"
label = "Current gain"
default = "10"

[sim.electrical]
device = "X"
body = """
.subckt bench_cccs op on cp cn params: GAIN=10
VSENSE cp cn DC 0
FOUT op on VSENSE {GAIN}
.ends bench_cccs
"""
line = "{dev} {op} {on} {cp} {cn} bench_cccs GAIN={gain}"
model_kind = "project-subckt"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; ngspice linear F element with a 0 V sense source"
license = "MIT"
