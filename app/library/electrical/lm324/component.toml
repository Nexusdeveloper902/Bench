format = 1
id = "LM324"
version = 1
name = "LM324 quad op-amp"
description = "Quad single-supply bipolar op-amp (14 pins), behavioural fit: GBW 1.2 MHz, 0.5 V/µs, output to about 1.5 V below V+ and 5 mV above ground."
designator = "U"
category = "Electrical"
subcategory = "Analog ICs"
aliases = ["LM324", "LM324N", "LM2902"]
keywords = ["op amp", "quad", "single supply", "LM324", "operational amplifier"]
tags = ["analog", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral fit to datasheet typicals, not a vendor macromodel.",
               "Four bench_opamp_macro instances sharing the supply pins; the ±40 mA short-circuit limit, crossover distortion and the 30 µA sink limit near ground are not modelled.",
               "Output resistance 50 Ω is an assumption; the datasheet does not list it.",
               "The output current comes from the model's ground reference, not from the supply pins: the supply pins draw only the quiescent current IQ (and clamp current in saturation).",
               "No output short-circuit current limit, input common-mode range limit, input protection or phase reversal; inputs see 1 TΩ and the bias current only.",
               "Long time steps can overshoot a fast edge where slewing ends: measured under 0.1 V at 2 µs steps, up to 0.2 V at 5 µs and 0.4 V at 10 µs (GAPS G20). Shorten the time step to check a fast edge."]
docs = ["https://www.ti.com/lit/ds/symlink/lm324.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 200]
symbol = "symbol.svg"

[[pins]]
id = "out1"
name = "OUT1"
at = [80, 40]
description = "Output 1 (pin 1)"

[[pins]]
id = "in1n"
name = "IN1-"
at = [0, 60]
description = "Inverting input 1 (pin 2)"

[[pins]]
id = "in1p"
name = "IN1+"
at = [0, 40]
description = "Non-inverting input 1 (pin 3)"

[[pins]]
id = "vcc"
name = "V+"
at = [40, 0]
description = "Positive supply (pin 4)"

[[pins]]
id = "in2p"
name = "IN2+"
at = [0, 80]
description = "Non-inverting input 2 (pin 5)"

[[pins]]
id = "in2n"
name = "IN2-"
at = [0, 100]
description = "Inverting input 2 (pin 6)"

[[pins]]
id = "out2"
name = "OUT2"
at = [80, 60]
description = "Output 2 (pin 7)"

[[pins]]
id = "out3"
name = "OUT3"
at = [80, 80]
description = "Output 3 (pin 8)"

[[pins]]
id = "in3n"
name = "IN3-"
at = [0, 140]
description = "Inverting input 3 (pin 9)"

[[pins]]
id = "in3p"
name = "IN3+"
at = [0, 120]
description = "Non-inverting input 3 (pin 10)"

[[pins]]
id = "vee"
name = "GND"
at = [40, 200]
description = "Negative supply or ground (pin 11)"

[[pins]]
id = "in4p"
name = "IN4+"
at = [0, 160]
description = "Non-inverting input 4 (pin 12)"

[[pins]]
id = "in4n"
name = "IN4-"
at = [0, 180]
description = "Inverting input 4 (pin 13)"

[[pins]]
id = "out4"
name = "OUT4"
at = [80, 100]
description = "Output 4 (pin 14)"

[sim.electrical]
device = "X"
line = "{dev} {out1} {in1n} {in1p} {vcc} {in2p} {in2n} {out2} {out3} {in3n} {in3p} {vee} {in4p} {in4n} {out4} bench_lm324"
defs = ["models:analog/opamp_macro.lib"]
body = """
.subckt bench_lm324 out1 in1n in1p vcc in2p in2n out2 out3 in3n in3p vee in4p in4n out4
XA in1p in1n vcc vee out1 bench_opamp_macro AOL=100k GBW=1.2meg SR=0.5meg VOS=3m IB=-20n ROUT=50 IQ=175u VDROPH=1.5 VDROPL=5m
XB in2p in2n vcc vee out2 bench_opamp_macro AOL=100k GBW=1.2meg SR=0.5meg VOS=3m IB=-20n ROUT=50 IQ=175u VDROPH=1.5 VDROPL=5m
XC in3p in3n vcc vee out3 bench_opamp_macro AOL=100k GBW=1.2meg SR=0.5meg VOS=3m IB=-20n ROUT=50 IQ=175u VDROPH=1.5 VDROPL=5m
XD in4p in4n vcc vee out4 bench_opamp_macro AOL=100k GBW=1.2meg SR=0.5meg VOS=3m IB=-20n ROUT=50 IQ=175u VDROPH=1.5 VDROPL=5m
.ends bench_lm324
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; four bench_opamp_macro instances with parameters fitted to the LM324 datasheet typical values"
url = "https://www.ti.com/lit/ds/symlink/lm324.pdf"
version = "TI SLOS066AE, August 1975, revised September 2025 (sections 6.7 and 6.10, LM324 column)"
license = "MIT"
retrieved = "2026-10-11"
notes = "Typicals: AVD 100 V/mV (VCC = 15 V); unity-gain bandwidth 1.2 MHz; SR 0.5 V/us (VCC = +-15 V); VIO 3 mV; IIB -20 nA; ICC 0.7 mA for four amplifiers (175 uA each); VOH >= VCC - 1.5 V (RL = 2 kohm); VOL 5 mV (RL <= 10 kohm). ROUT 50 ohm is an assumption."
