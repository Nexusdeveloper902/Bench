version = "Zetex 2N7000, issue 2, November 1994"
license = "MIT"
retrieved = "2026-10-11"
notes = "Targets: VGS(th) 0.8-3.0 V (ID=1 mA); RDS(on) <= 5 ohm (10 V, 0.5 A); VDS(on) <= 0.4 V (4.5 V, 75 mA); gfs >= 100 mS (10 V, 0.2 A); ID(on) >= 75 mA (4.5 V, 10 V); Ciss <= 60 pF, Coss <= 25 pF, Crss <= 5 pF."
