format = 1
id = "M_2N7000"
version = 1
name = "2N7000 N-channel MOSFET"
description = "60 V, 200 mA enhancement-mode small-signal N-MOSFET: VGS(th) about 2 V, RDS(on) about 1.4 ohm at 10 V / 0.5 A."
designator = "Q"
category = "Electrical"
subcategory = "MOSFETs"
aliases = ["2N7000"]
keywords = ["mosfet", "fet", "vdmos", "power", "2N7000", "TO-92", "logic level", "small signal"]
tags = ["MOSFET", "semiconductor"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Project-authored fit to the Zetex datasheet limits, not a vendor SPICE model: threshold 2.0 V (250 uA), RDS(on) 1.4 ohm at 10 V / 0.5 A, gfs 0.22 S at 0.2 A (all inside the limits).",
               "The datasheet gives only maxima for the capacitances; they are set to about 70 % of them (Ciss 42 pF, Coss 18 pF, Crss 3.5 pF) with Cgd held constant.",
               "Three-pin VDMOS model (body tied to source) with an integral body diode. The gate has no DC path, so drive it through a resistor or a voltage source. Temperature dependence, avalanche energy, safe operating area and self-heating are not modelled."]
docs = ["https://www.diodes.com/assets/Datasheets/2N7000.pdf", "https://ngspice.sourceforge.io/docs.html"]

