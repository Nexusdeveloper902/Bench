format = 1
id = "D_UF4007"
version = 1
name = "UF4007 fast-recovery diode"
description = "Ultra-fast 1 A, 1000 V rectifier (UF4001 to UF4007 series): about 1.3 V at 1 A and a reverse recovery near 55 ns."
designator = "D"
category = "Electrical"
subcategory = "Diodes"
aliases = ["UF4007", "ultrafast diode"]
keywords = ["fast recovery", "ultrafast", "rectifier", "diode", "UF4007", "trr"]
tags = ["semiconductor"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Project-authored fit to the Vishay datasheet, not a vendor SPICE model. 1.3 V at 1 A (datasheet maximum 1.7 V for the UF4005 to UF4007 grades).",
               "Transit time Tt = 150 ns was tuned so a simulation of the datasheet's trr test (0.5 A forward, 1 A reverse, recovery to 0.25 A) gives about 55 ns (datasheet maximum 75 ns); softness of the recovery is not fitted.",
               "Junction capacitance fitted to 17 pF at 4 V. Breakdown starts at the 1000 V rating; below it the leakage is the saturation current (5 nA), under the datasheet's 10 uA maximum.",
               "Temperature dependence, noise and self-heating are not modelled."]
docs = ["https://www.vishay.com/docs/88755/uf4001.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 30]
symbol = "symbol.svg"
show_current = true

[[pins]]
id = "a"
name = "Anode"
at = [0, 15]

[[pins]]
id = "k"
name = "Cathode"
at = [60, 15]

[sim.electrical]
device = "D"
line = "{dev} {a} {k} duf4007"
models = [".model duf4007 D(Is=5.37n N=2 Rs=315m Cjo=44p Vj=0.7 M=0.5 Tt=150n BV=1000 IBV=1m)"]
current = "@{dev_lc}[id]"
model_kind = "model"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; parameter set fitted to the Vishay UF4001-UF4007 datasheet values"
url = "https://www.vishay.com/docs/88755/uf4001.pdf"
version = "Vishay UF4001-UF4007, document 88755, revision 06-Apr-2020"
license = "MIT"
retrieved = "2026-10-11"
notes = "Targets: VF(1 A) <= 1.7 V (max), IR <= 10 uA at rated voltage (max; the model leaks less), trr <= 75 ns (IF=0.5 A, IR=1 A, Irr=0.25 A), CJ = 17 pF at 4 V (typ). Tt chosen so that the datasheet's trr test circuit gives about 55 ns."
