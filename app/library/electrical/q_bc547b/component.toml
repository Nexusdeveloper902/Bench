limitations = ["Project-authored fit to the Philips datasheet's typical values for the B gain group, not a vendor SPICE model: hFE about 305 at 2 mA (5 V), VBE 0.66 V, VCE(sat) 0.08 V at 10 mA / 0.5 mA.",
               "Gain group A and C parts differ (hFE about 180 and 520); use the generic NPN with another Bf for those. Tf = 0.4 ns is an assumption in line with the 100 MHz minimum fT.",
