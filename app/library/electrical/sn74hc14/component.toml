[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "45"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "12n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {a1} {a2} {a3} {a4} {a5} {a6} {y1} {y2} {y3} {y4} {y5} {y6} {vcc} {gnd} bench_sn74hc14 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/gates.lib"]
body = """
.subckt bench_sn74hc14 a1 a2 a3 a4 a5 a6 y1 y2 y3 y4 y5 y6 vc gn params: ROUT=45 TPD=12n
X1 vc gn a1 y1 bench_d_sinv VP=0.556 VN=0.356 ROUT={ROUT} TPD={TPD}
X2 vc gn a2 y2 bench_d_sinv VP=0.556 VN=0.356 ROUT={ROUT} TPD={TPD}
X3 vc gn a3 y3 bench_d_sinv VP=0.556 VN=0.356 ROUT={ROUT} TPD={TPD}
X4 vc gn a4 y4 bench_d_sinv VP=0.556 VN=0.356 ROUT={ROUT} TPD={TPD}
X5 vc gn a5 y5 bench_d_sinv VP=0.556 VN=0.356 ROUT={ROUT} TPD={TPD}
X6 vc gn a6 y6 bench_d_sinv VP=0.556 VN=0.356 ROUT={ROUT} TPD={TPD}
.ends bench_sn74hc14
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74hc14.pdf"
version = "TI SCLS085L, revised February 2025"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 2-6 V; at 4.5 V VT+ 1.55 V min, 2.5 V typ, 3.13 V max, VT- 0.9 V min, 1.6 V typ, 2.45 V max, hysteresis 0.9 V typ; tpd 12 ns typ."
