description = "Gate 2 input (pin 3)"

[[pins]]
id = "a3"
name = "3A"
at = [0, 80]
description = "Gate 3 input (pin 5)"

[[pins]]
id = "a4"
name = "4A"
at = [0, 100]
description = "Gate 4 input (pin 9)"

[[pins]]
id = "a5"
name = "5A"
at = [0, 120]
description = "Gate 5 input (pin 11)"

[[pins]]
id = "a6"
name = "6A"
at = [0, 140]
description = "Gate 6 input (pin 13)"

[[pins]]
id = "y1"
name = "1Y"
at = [120, 40]
description = "Gate 1 output (pin 2)"

[[pins]]
id = "y2"
name = "2Y"
at = [120, 60]
description = "Gate 2 output (pin 4)"

[[pins]]
id = "y3"
name = "3Y"
at = [120, 80]
description = "Gate 3 output (pin 6)"

[[pins]]
id = "y4"
name = "4Y"
at = [120, 100]
description = "Gate 4 output (pin 8)"

[[pins]]
id = "y5"
name = "5Y"
