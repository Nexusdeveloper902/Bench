name = "BSS138 N-channel MOSFET"
description = "50 V, 220 mA logic-level N-MOSFET in SOT-23: VGS(th) about 1.2 V, RDS(on) about 1.4 ohm at 10 V / 0.22 A."
designator = "Q"
category = "Electrical"
subcategory = "MOSFETs"
aliases = ["BSS138"]
keywords = ["mosfet", "fet", "vdmos", "power", "BSS138", "SOT-23", "logic level", "level shifter"]
tags = ["MOSFET", "semiconductor"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Project-authored fit to the Diodes Incorporated datasheet, not a vendor SPICE model: threshold 1.2 V (250 uA), RDS(on) 1.4 ohm at 10 V / 0.22 A, gfs 0.2 S at 0.2 A.",
               "Capacitances are about 70 % of the datasheet maxima (Ciss 36 pF, Coss 18 pF, Crss 5.6 pF) with Cgd held constant.",
               "Gate-source threshold is below 2 V but RDS(on) is only specified at 10 V; at 3.3 V gate drive the model conducts about 0.06 A at 1 V VDS.",
               "Three-pin VDMOS model (body tied to source) with an integral body diode. The gate has no DC path, so drive it through a resistor or a voltage source. Temperature dependence, avalanche energy, safe operating area and self-heating are not modelled."]
docs = ["https://www.diodes.com/assets/Datasheets/BSS138.pdf", "https://ngspice.sourceforge.io/docs.html"]

