notes = "Targets: VGS(th) 0.5-1.5 V, typ 1.2 V (250 uA); RDS(on) 1.4 ohm typ, <= 3.5 ohm (10 V, 0.22 A); gfs >= 100 mS (25 V, 0.2 A); Ciss <= 50 pF, Coss <= 25 pF, Crss <= 8 pF."
