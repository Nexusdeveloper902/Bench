[[params]]
key = "ron"
label = "On resistance"
unit = "Ω"
default = "470"
min = 0
min_exclusive = true
help = "Typical: 470 Ω at VDD = 5 V, 180 Ω at 10 V, 125 Ω at 15 V"

[sim.electrical]
device = "X"
line = "{dev} {ch4} {ch6} {com} {ch7} {ch5} {inh} {vee} {vss} {c} {b} {a} {ch3} {ch0} {ch1} {ch2} {vdd} bench_cd4051 RON={ron}"
defs = ["models:analog/aswitch.lib"]
body = """
.subckt bench_cd4051 ch4 ch6 com ch7 ch5 inh vee vss c b a ch3 ch0 ch1 ch2 vdd params: RON=470
* binary tree: INH (on while low), then C, B and A levels; each of the 4 switches in a path has RON/4
XI com n inh vdd vss bench_asw_lo RON={RON/4}
XC0 n c0 c vdd vss bench_asw_lo RON={RON/4}
XC1 n c1 c vdd vss bench_asw_hi RON={RON/4}
XB00 c0 b00 b vdd vss bench_asw_lo RON={RON/4}
XB01 c0 b01 b vdd vss bench_asw_hi RON={RON/4}
XB10 c1 b10 b vdd vss bench_asw_lo RON={RON/4}
XB11 c1 b11 b vdd vss bench_asw_hi RON={RON/4}
XA0 b00 ch0 a vdd vss bench_asw_lo RON={RON/4}
XA1 b00 ch1 a vdd vss bench_asw_hi RON={RON/4}
XA2 b01 ch2 a vdd vss bench_asw_lo RON={RON/4}
XA3 b01 ch3 a vdd vss bench_asw_hi RON={RON/4}
XA4 b10 ch4 a vdd vss bench_asw_lo RON={RON/4}
XA5 b10 ch5 a vdd vss bench_asw_hi RON={RON/4}
XA6 b11 ch6 a vdd vss bench_asw_lo RON={RON/4}
XA7 b11 ch7 a vdd vss bench_asw_hi RON={RON/4}
Rvee vee vss 1e9
.ends bench_cd4051
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; tree of bench_asw switches decoding the address, on resistance from the CD4051B datasheet"
url = "https://www.ti.com/lit/ds/symlink/cd4051b.pdf"
version = "TI SCHS047O, August 1998, revised May 2026"
license = "MIT"
retrieved = "2026-10-11"
notes = "rON typical 470 ohm (VDD = 5 V), 180 ohm (10 V), 125 ohm (15 V), 0 <= VIS <= VDD; truth table: INH low, channel = 4C + 2B + A."
