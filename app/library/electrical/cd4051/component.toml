format = 1
id = "CD4051"
version = 1
name = "CD4051B 8-channel analog multiplexer"
description = "8:1 CMOS analog multiplexer/demultiplexer: address inputs A, B, C connect channel (4C + 2B + A) to COM; INH high opens every channel (16 pins)."
designator = "U"
category = "Electrical"
subcategory = "Analog switches"
aliases = ["CD4051", "CD4051B", "4051", "74HC4051"]
keywords = ["multiplexer", "mux", "analog switch", "8 channel", "4051", "CD4000"]
tags = ["cmos", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral fit to datasheet typicals, not a vendor macromodel.",
               "Constant on resistance RON (default: the 5 V typical; the datasheet gives 180 Ω at 10 V and 125 Ω at 15 V): no dependence on supply or signal voltage, no capacitance, charge injection or switching time.",
               "Signals are not clamped to the supplies, and the control threshold is (VDD + VSS) / 2 with 50 mV hysteresis; the control inputs draw no current.",
               "VEE (the analog negative supply) is only tied to VSS through 1 GΩ: signal levels below VSS are not limited, and the logic levels are referred to VDD and VSS only."]
docs = ["https://www.ti.com/lit/ds/symlink/cd4051b.pdf", "https://ngspice.sourceforge.io/docs.html"]

