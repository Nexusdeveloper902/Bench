[[params]]
key = "ron"
label = "On resistance"
unit = "Ω"
default = "470"
min = 0
min_exclusive = true
help = "Typical: 470 Ω at VDD = 5 V, 180 Ω at 10 V, 125 Ω at 15 V"

[sim.electrical]
device = "X"
line = "{dev} {by} {bx} {cy} {ccom} {cx} {inh} {vee} {vss} {c} {b} {a} {ax} {ay} {acom} {bcom} {vdd} bench_cd4053 RON={ron}"
defs = ["models:analog/aswitch.lib"]
body = """
.subckt bench_cd4053 by bx cy ccom cx inh vee vss c b a ax ay acom bcom vdd params: RON=470
* per section: INH (on while low), then the select level (low = x, high = y); each of the 2 switches has RON/2
XIA acom an inh vdd vss bench_asw_lo RON={RON/2}
XAX an ax a vdd vss bench_asw_lo RON={RON/2}
XAY an ay a vdd vss bench_asw_hi RON={RON/2}
XIB bcom bn inh vdd vss bench_asw_lo RON={RON/2}
XBX bn bx b vdd vss bench_asw_lo RON={RON/2}
XBY bn by b vdd vss bench_asw_hi RON={RON/2}
XIC ccom cn inh vdd vss bench_asw_lo RON={RON/2}
XCX cn cx c vdd vss bench_asw_lo RON={RON/2}
XCY cn cy c vdd vss bench_asw_hi RON={RON/2}
Rvee vee vss 1e9
.ends bench_cd4053
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; bench_asw switch pairs, on resistance from the CD405xB datasheet"
url = "https://www.ti.com/lit/ds/symlink/cd4051b.pdf"
version = "TI SCHS047O (CD4051B, CD4052B, CD4053B), August 1998, revised May 2026"
license = "MIT"
retrieved = "2026-10-11"
notes = "rON typical 470 ohm (VDD = 5 V), 180 ohm (10 V), 125 ohm (15 V); truth table: INH low, select low = x, high = y."
