format = 1
id = "CRYSTAL_32K"
version = 1
name = "Crystal 32.768 kHz (tuning fork, BVD)"
description = "32.768 kHz watch-type quartz crystal as a Butterworth-Van Dyke equivalent: series motional RLC (Rs, Ls, Cs) in parallel with Cp. Typical published-range motional values."
designator = "Y"
category = "Electrical"
subcategory = "Timing"
aliases = ["watch crystal", "tuning fork crystal", "32.768 kHz crystal"]
keywords = ["crystal", "resonator", "32.768 kHz", "watch", "RTC", "BVD", "quartz", "subcircuit"]
tags = ["timing", "resonator"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Butterworth-Van Dyke equivalent: the electrical response near the series resonance only. Drive level, load capacitance, temperature (the parabolic curve) and ageing are not modelled.",
               "Typical values, not a datasheet fit: Ls 6.74 kH, Cs 3.5 fF, Rs 50 kΩ, Cp 1.5 pF, which give fs = 32.768 kHz and Q near 28 000. A real part with a different load capacitance pulls the frequency.",
               "The two pins have no DC path through the crystal: wire one of them to a DC path, or the validator reports NO-DC-PATH."]
docs = ["https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 60, 30]
symbol = "symbol.svg"

[[pins]]
id = "a"
at = [0, 15]

[[pins]]
id = "b"
at = [60, 15]

[[params]]
key = "lm"
label = "Motional inductance Ls"
unit = "H"
default = "6.74k"
min = 0
min_exclusive = true

[[params]]
key = "cm"
label = "Motional capacitance Cs"
unit = "F"
default = "3.5f"
min = 0
min_exclusive = true

[[params]]
key = "rm"
label = "Series resistance Rs"
unit = "Ω"
default = "50k"
min = 0
min_exclusive = true

[[params]]
key = "c0"
label = "Shunt capacitance Cp"
unit = "F"
default = "1.5p"
min = 0
min_exclusive = true

[sim.electrical]
device = "X"
line = "{dev} {a} {b} bench_bvd LM={lm} CM={cm} RM={rm} C0={c0}"
defs = ["models:resonators/bvd.lib"]
model_kind = "equivalent"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; BVD equivalent with typical 32.768 kHz tuning-fork values (generic, not a datasheet fit)"
license = "MIT"
