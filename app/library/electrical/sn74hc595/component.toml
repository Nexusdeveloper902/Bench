format = 1
id = "SN74HC595"
version = 1
name = "74HC595 8-bit shift register with output latches"
description = "Eight-bit serial-in shift register with an eight-bit storage register and tri-state outputs (16 pins)."
designator = "U"
category = "Electrical"
subcategory = "Counters and shift registers"
aliases = ["74HC595", "SN74HC595", "HC595"]
keywords = ["SN74HC595", "HC595", "shift register", "serial", "8-bit", "latch"]
tags = ["logic", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral model built from XSPICE digital code models behind analog bridges, not a vendor SPICE model: logic function is exact, electrical behavior is nominal.",
               "Inputs switch at about half the supply (guaranteed VIL 0.3 x VCC, VIH 0.7 x VCC lie inside the 0.45 to 0.55 x VCC band where the output goes unknown), outputs swing from GND to VCC through the ROUT parameter.",
               "When SRCLK and RCLK rise together the storage register sees the shift register's previous value, as in the real part; a Hi-Z output is a 1 GΩ leak to GND.",
               "Logic levels follow the supply pins: input thresholds and output swing scale with (VCC - GND), and the unknown region between the two input thresholds drives mid-level; supply current (static and dynamic), output current drawn from VCC, output current limit, input capacitance, clamp diodes and input leakage are not modelled.",
               "One nominal propagation delay (the TPD parameter plus about 2 ns of bridge delay), equal for rising and falling edges and independent of load and supply; setup time, hold time, minimum pulse width and metastability are not checked.",
               "Unconnected data and clock inputs read low (1 GΩ to GND); unconnected clear, preset, set, reset and load inputs read inactive and unconnected enable and output-enable inputs read enabled (1 GΩ to the rail). A real part leaves them undefined, so tie every input. Sequential parts power up with every output low, and a clock input that is already high at t = 0 produces one clock edge at power-up (the digital nodes start low)."]
docs = ["https://www.ti.com/lit/ds/symlink/sn74hc595.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 120, 240]
symbol = "symbol.svg"

[[pins]]
id = "ser"
name = "SER"
at = [0, 40]
description = "Serial data input (pin 14)"

[[pins]]
id = "srclk"
name = "SRCLK"
at = [0, 60]
description = "Shift register clock, rising edge (pin 11)"

[[pins]]
id = "rclk"
name = "RCLK"
at = [0, 80]
description = "Storage register clock, rising edge (pin 12)"

[[pins]]
id = "srclrb"
name = "SRCLR̅"
at = [0, 100]
description = "Shift register clear, active low (pin 10)"

[[pins]]
id = "oeb"
name = "OE̅"
at = [0, 120]
description = "Output enable, active low (pin 13)"

[[pins]]
id = "qa"
name = "QA"
at = [120, 40]
description = "Parallel output A (pin 15)"

[[pins]]
id = "qb"
name = "QB"
at = [120, 60]
description = "Parallel output B (pin 1)"

[[pins]]
id = "qc"
name = "QC"
at = [120, 80]
description = "Parallel output C (pin 2)"

[[pins]]
id = "qd"
name = "QD"
at = [120, 100]
description = "Parallel output D (pin 3)"

[[pins]]
id = "qe"
name = "QE"
at = [120, 120]
description = "Parallel output E (pin 4)"

[[pins]]
id = "qf"
name = "QF"
at = [120, 140]
description = "Parallel output F (pin 5)"

[[pins]]
id = "qg"
name = "QG"
at = [120, 160]
description = "Parallel output G (pin 6)"

[[pins]]
id = "qh"
name = "QH"
at = [120, 180]
description = "Parallel output H (pin 7)"

[[pins]]
id = "qs"
name = "QH'"
at = [120, 200]
description = "Serial output: last shift register stage, always driven (pin 9)"

[[pins]]
id = "vcc"
name = "VCC"
at = [60, 0]
description = "Positive supply (pin 16)"

[[pins]]
id = "gnd"
name = "GND"
at = [60, 240]
description = "Ground (pin 8)"

[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "45"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "20n"
min = 0
min_exclusive = true
help = "Nominal clock-to-output (or input-to-output) delay of the logic; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {ser} {srclk} {rclk} {srclrb} {oeb} {qa} {qb} {qc} {qd} {qe} {qf} {qg} {qh} {qs} {vcc} {gnd} bench_74hc595 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/seq.lib"]
body = """
.subckt bench_74hc595 ser srclk rclk srclrb oeb qa qb qc qd qe qf qg qh qs vc gn params: ROUT=45 TPD=20n
X1 vc gn ser srclk rclk srclrb oeb qa qb qc qd qe qf qg qh qs bench_d_sr595  ROUT={ROUT} TPD={TPD}
.ends bench_74hc595
"""
model_kind = "behavioral"
verification = "analytic"

[sim.electrical.provenance]
source = "Bench project; XSPICE digital code models behind bench_din/bench_dout bridges, pinout and function table from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74hc595.pdf"
version = "TI SCLS041J, revised October 2021"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 2-6 V; SER is shifted into QA on each rising SRCLK, the shift register copies to the outputs on each rising RCLK, SRCLR low clears the shift register only, OE high puts QA-QH in Hi-Z; QH' is the shift register's last stage; tpd about 13-22 ns typ."
