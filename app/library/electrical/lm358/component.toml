format = 1
id = "LM358"
version = 1
name = "LM358 dual op-amp"
description = "Dual single-supply bipolar op-amp (8 pins), behavioural fit: GBW 0.7 MHz, 0.3 V/µs, output to about 1.5 V below V+ and 5 mV above ground."
designator = "U"
category = "Electrical"
subcategory = "Analog ICs"
aliases = ["LM358", "LM358N", "LM2904"]
keywords = ["op amp", "dual", "single supply", "LM358", "operational amplifier"]
tags = ["analog", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral fit to datasheet typicals, not a vendor macromodel.",
               "Fixed fit for the plain LM358 (not the LM358B/BA, which are faster); the ±40 mA short-circuit limit, crossover distortion and the 30 µA sink limit near ground are not modelled.",
               "Output resistance 50 Ω is an assumption; the datasheet does not list it.",
               "The output current comes from the model's ground reference, not from the supply pins: the supply pins draw only the quiescent current IQ (and clamp current in saturation).",
               "No output short-circuit current limit, input common-mode range limit, input protection or phase reversal; inputs see 1 TΩ and the bias current only.",
               "Large-signal edges can ring numerically: with a time step above about 1/(40·GBW) the output can spike towards a rail just after a fast input step (seen: an LM324 gain-2 stage, falling step, 2 µs steps). Shorten the time step to check a fast edge (GAPS G20)."]
docs = ["https://www.ti.com/lit/ds/symlink/lm358.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 80, 120]
symbol = "symbol.svg"

[[pins]]
id = "out1"
name = "OUT1"
at = [80, 40]
description = "Output A (pin 1)"

[[pins]]
id = "in1n"
name = "IN1-"
at = [0, 60]
description = "Inverting input A (pin 2)"

[[pins]]
id = "in1p"
name = "IN1+"
at = [0, 40]
description = "Non-inverting input A (pin 3)"

[[pins]]
id = "vee"
name = "V-"
at = [40, 120]
description = "Negative supply or ground (pin 4)"

[[pins]]
id = "in2p"
name = "IN2+"
at = [0, 80]
description = "Non-inverting input B (pin 5)"

[[pins]]
id = "in2n"
name = "IN2-"
at = [0, 100]
description = "Inverting input B (pin 6)"

[[pins]]
id = "out2"
name = "OUT2"
at = [80, 60]
description = "Output B (pin 7)"

[[pins]]
id = "vcc"
name = "V+"
at = [40, 0]
description = "Positive supply (pin 8)"

[sim.electrical]
device = "X"
line = "{dev} {out1} {in1n} {in1p} {vee} {in2p} {in2n} {out2} {vcc} bench_lm358"
defs = ["models:analog/opamp_macro.lib"]
body = """
.subckt bench_lm358 out1 in1n in1p vee in2p in2n out2 vcc
XA in1p in1n vcc vee out1 bench_opamp_macro AOL=100k GBW=0.7meg SR=0.3meg VOS=3m IB=-20n ROUT=50 IQ=350u VDROPH=1.5 VDROPL=5m
XB in2p in2n vcc vee out2 bench_opamp_macro AOL=100k GBW=0.7meg SR=0.3meg VOS=3m IB=-20n ROUT=50 IQ=350u VDROPH=1.5 VDROPL=5m
.ends bench_lm358
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; two bench_opamp_macro instances with parameters fitted to the LM358 datasheet typical values"
url = "https://www.ti.com/lit/ds/symlink/lm358.pdf"
version = "TI SLOS068AB, June 1976, revised October 2024 (section 5.7, LM358 column)"
license = "MIT"
retrieved = "2026-10-11"
notes = "Typicals at VS = 5 V unless noted: AOL 100 V/mV (VS = 15 V); GBW 0.7 MHz; SR 0.3 V/us; VOS 3 mV; IB -20 nA (out of the pins); IQ 350 uA per amplifier; positive swing 1.5 V below V+ (RL >= 2 kohm, max) and about 2 V at 30 V; negative swing 5 mV above ground (RL <= 10 kohm). ROUT 50 ohm is an assumption (not in the datasheet)."
