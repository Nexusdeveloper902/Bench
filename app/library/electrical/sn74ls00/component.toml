format = 1
id = "SN74LS00"
version = 1
name = "74LS00 quad 2-input NAND gate (TTL)"
description = "Four independent 2-input NAND gates with TTL input thresholds and TTL output levels (14 pins)."
designator = "U"
category = "Electrical"
subcategory = "Logic gates"
aliases = ["74LS00", "SN74LS00", "LS00"]
keywords = ["SN74LS00", "LS00", "logic", "gate", "NAND"]
tags = ["logic", "ic"]
domain = "electrical"
capabilities = ["interface", "sim:electrical"]
limitations = ["Behavioral model built from XSPICE digital code models behind analog bridges, not a vendor SPICE model: logic function is exact, electrical behavior is nominal.",
               "TTL levels: inputs switch between 1.2 V and 1.4 V above GND (guaranteed VIL 0.8 V, VIH 2.0 V) whatever the supply, outputs swing 0.25 V to 3.4 V at VCC = 5 V (scaled with the supply pins), 15 Ω output impedance in both states (the real output is asymmetric: 8 mA sink, 0.4 mA source).",
               "Logic levels follow the supply pins: input thresholds and output swing scale with (VCC - GND), and the unknown region between the two input thresholds drives mid-level; supply current (static and dynamic), output current drawn from VCC, output current limit, input capacitance, clamp diodes and input leakage are not modelled.",
               "One nominal propagation delay (the TPD parameter plus about 2 ns of bridge delay), equal for rising and falling edges and independent of load and supply; setup time, hold time, minimum pulse width and metastability are not checked.",
               "Unconnected data and clock inputs read low (1 GΩ to GND); unconnected clear, preset, set, reset and load inputs read inactive and unconnected enable and output-enable inputs read enabled (1 GΩ to the rail). A real part leaves them undefined, so tie every input."]
docs = ["https://www.ti.com/lit/ds/symlink/sn74ls00.pdf", "https://ngspice.sourceforge.io/docs.html"]

[presentation]
box = [0, 0, 120, 220]
symbol = "symbol.svg"

