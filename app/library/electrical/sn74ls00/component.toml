[[params]]
key = "rout"
label = "Output impedance"
unit = "Ω"
default = "15"
min = 0
min_exclusive = true
help = "Series resistance of each output in both states"

[[params]]
key = "tpd"
label = "Propagation delay"
unit = "s"
default = "10n"
min = 0
min_exclusive = true
help = "Nominal delay of the gate itself; bridges add about 2 ns"

[sim.electrical]
device = "X"
line = "{dev} {a1} {b1} {a2} {b2} {a3} {b3} {a4} {b4} {y1} {y2} {y3} {y4} {vcc} {gnd} bench_74ls00 ROUT={rout} TPD={tpd}"
defs = ["models:digital/io.lib", "models:digital/gates.lib"]
body = """
.subckt bench_74ls00 a1 b1 a2 b2 a3 b3 a4 b4 y1 y2 y3 y4 vc gn params: ROUT=15 TPD=10n
X1 vc gn a1 b1 y1 bench_d_nand2 LO=1.2 HI=1.4 RK=0 AK=1 VOLF=0.05 VOHF=0.68 ROUT={ROUT} TPD={TPD}
X2 vc gn a2 b2 y2 bench_d_nand2 LO=1.2 HI=1.4 RK=0 AK=1 VOLF=0.05 VOHF=0.68 ROUT={ROUT} TPD={TPD}
X3 vc gn a3 b3 y3 bench_d_nand2 LO=1.2 HI=1.4 RK=0 AK=1 VOLF=0.05 VOHF=0.68 ROUT={ROUT} TPD={TPD}
X4 vc gn a4 b4 y4 bench_d_nand2 LO=1.2 HI=1.4 RK=0 AK=1 VOLF=0.05 VOHF=0.68 ROUT={ROUT} TPD={TPD}
.ends bench_74ls00
"""
model_kind = "behavioral"
verification = "reference"

[sim.electrical.provenance]
source = "Bench project; XSPICE d_nand2 behind bench_din/bench_dout bridges, pinout and levels from the datasheet"
url = "https://www.ti.com/lit/ds/symlink/sn74ls00.pdf"
version = "TI SDLS025D, revised May 2017"
license = "MIT"
retrieved = "2026-10-12"
notes = "VCC 4.75-5.25 V; VIH 2 V min, VIL 0.8 V max; VOH 3.4 V typ, VOL 0.25 V typ at 4 mA and 0.35 V at 8 mA; tpd 9 ns (low to high) and 10 ns (high to low) typ, CL = 15 pF."
