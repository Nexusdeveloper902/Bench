name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly stress

permissions:
  contents: read

env:
  NGSPICE_VERSION: "47"
  NGSPICE_PREFIX: /home/runner/ngspice47
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System packages (Qt offscreen, fonts, ngspice build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 \
            fonts-noto-core fonts-dejavu-core \
            build-essential bison flex libsuitesparse-dev libfftw3-dev

      # benchcore dlopen()s $BENCH_LIBNGSPICE if set, else tries /usr/lib, /usr/local/lib,
      # /usr/lib/x86_64-linux-gnu and the loader search path; the symlink below satisfies the first. The
      # tests depend on ngspice-47 behaviour; Ubuntu's apt ngspice is older.
      - name: Cache ngspice
        id: ngcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NGSPICE_PREFIX }}
          key: ngspice-${{ env.NGSPICE_VERSION }}-shared-${{ runner.os }}-v1

      - name: Build ngspice from source
        if: steps.ngcache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ngspice.tar.gz \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz"
          echo "894e649651f1838a14095e5a5439e7d3aa63e87ede14d283173fda4fcdef675f  ngspice.tar.gz" | sha256sum -c -
          mkdir ngsrc && tar -xzf ngspice.tar.gz -C ngsrc --strip-components=1
          cd ngsrc
          ./configure --prefix="$NGSPICE_PREFIX" --with-ngshared --without-x \
            --with-readline=no --enable-xspice --enable-cider --enable-osdi \
            --enable-klu --disable-debug
          make -j"$(nproc)"
          make install

      - name: Expose libngspice at /usr/lib/libngspice.so
        run: |
          sudo ln -sf "$NGSPICE_PREFIX/lib/libngspice.so" /usr/lib/libngspice.so
          ls -l /usr/lib/libngspice.so

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: benchcore

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Python deps
        run: pip install PySide6 matplotlib pytest pytest-xdist maturin

      - name: Build and install benchcore wheel
        run: |
          cd benchcore
          maturin build --release
          pip install --force-reinstall target/wheels/benchcore-*.whl

      # Runs everything: cargo test + benchcore python + app suite (parallel, shuffled, then `timing` tests serially) + catalog.
      # The shuffle seed and a repro command are printed in the log.
      - name: Tests
        run: scripts/test check

      # Weekly / manual only: the same suites under varied conditions (probes, GIL interval, CPU contention). See docs/testing.md.
      - name: Stress
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: scripts/test stress
